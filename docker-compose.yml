services:
  nmos-federation:
    build: .
    image: gemini2350/nmos-federation:latest
    container_name: nmos-federation
    # Required: the software needs one interface with a real IP per domain
    # (node href, manifest fetch, mDNS discovery of the internal registry).
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/config
    environment:
      - PORT=8080
      - LOG_LEVEL=info
